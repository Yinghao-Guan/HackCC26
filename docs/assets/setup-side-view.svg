<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Physical setup: side view, projector raised (Option B)</text>

  <!-- floor -->
  <line x1="30" y1="500" x2="870" y2="500" stroke="#555" stroke-width="3"/>

  <!-- projector stand + projector -->
  <line x1="105" y1="131" x2="105" y2="500" stroke="#90a4ae" stroke-width="8"/>
  <rect x="70" y="95" width="75" height="36" rx="4" fill="#607d8b"/>
  <circle cx="142" cy="113" r="5" fill="#ffeb3b" stroke="#f9a825"/>
  <text x="105" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Projector</text>
  <text x="105" y="156" text-anchor="middle" font-size="12" fill="#333">upright on a tall,</text>
  <text x="105" y="171" text-anchor="middle" font-size="12" fill="#333">stable platform</text>

  <!-- beam to board top and bottom -->
  <polygon points="142,113 620,130 560,490" fill="#ffd54f" fill-opacity="0.22" stroke="#f9a825" stroke-dasharray="6 4"/>

  <!-- easel strut -->
  <line x1="603" y1="190" x2="800" y2="500" stroke="#8d6e63" stroke-width="8"/>
  <rect x="535" y="490" width="80" height="10" fill="#8d6e63"/>

  <!-- board (tilted back) -->
  <line x1="560" y1="490" x2="620" y2="130" stroke="#455a64" stroke-width="12" stroke-linecap="round"/>
  <text x="690" y="130" font-size="14" font-weight="bold" fill="#222">Whiteboard</text>
  <text x="690" y="147" font-size="12" fill="#333">tilted back on an easel.</text>
  <text x="690" y="162" font-size="12" fill="#333">Any tilt is fine: the homography</text>
  <text x="690" y="177" font-size="12" fill="#333">models an arbitrary plane.</text>
  <text x="690" y="195" font-size="12" fill="#333">It must not move after calibration.</text>

  <!-- arm and fingertip -->
  <line x1="390" y1="395" x2="573" y2="331" stroke="#f4b183" stroke-width="16" stroke-linecap="round"/>
  <circle cx="575" cy="330" r="5" fill="#d84315"/>
  <text x="470" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Hand</text>
  <text x="560" y="312" text-anchor="end" font-size="12" fill="#d84315">fingertip</text>

  <!-- shadow tip -->
  <circle cx="586" cy="335" r="5" fill="#212121"/>
  <text x="604" y="360" font-size="12" fill="#212121">shadow tip</text>
  <text x="604" y="375" font-size="12" fill="#212121">on the board</text>
  <text x="604" y="392" font-size="11" fill="#555">gap → 0 at touch</text>

  <!-- camera hint -->
  <rect x="318" y="438" width="22" height="38" rx="4" fill="#212121"/>
  <circle cx="329" cy="444" r="3" fill="#4fc3f7"/>
  <text x="329" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">iPhone</text>
  <path d="M340 450 C420 400 520 340 566 328" fill="none" stroke="#0288d1" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="362" y="462" font-size="12" fill="#01579b">oblique view from front-left</text>
  <text x="362" y="477" font-size="12" fill="#01579b">(out of this plane)</text>

  <!-- presenter note -->
  <text x="250" y="260" text-anchor="middle" font-size="12" fill="#333">Keep the presenter's body out</text>
  <text x="250" y="275" text-anchor="middle" font-size="12" fill="#333">of the beam: extra shadows</text>
  <text x="250" y="290" text-anchor="middle" font-size="12" fill="#333">confuse touch detection.</text>

  <text x="880" y="565" text-anchor="end" font-size="11" fill="#777">Not to scale.</text>
</svg>
