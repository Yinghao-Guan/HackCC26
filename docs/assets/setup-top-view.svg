<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Physical setup: top view</text>

  <!-- projection beam -->
  <polygon points="450,470 300,90 600,90" fill="#ffd54f" fill-opacity="0.25" stroke="#f9a825" stroke-dasharray="6 4"/>
  <text x="372" y="330" font-size="13" fill="#b26a00" transform="rotate(68 372 330)">projector beam</text>

  <!-- camera field of view -->
  <polygon points="142,365 285,90 615,90" fill="#4fc3f7" fill-opacity="0.15" stroke="#0288d1" stroke-dasharray="3 4"/>
  <text x="170" y="250" font-size="13" fill="#01579b" transform="rotate(-62 170 250)">camera field of view</text>

  <!-- central axis -->
  <line x1="450" y1="470" x2="450" y2="90" stroke="#666" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="458" y="400" font-size="13" fill="#555">central axis:</text>
  <text x="458" y="416" font-size="13" fill="#555">projector → hand → board</text>

  <!-- whiteboard -->
  <rect x="300" y="76" width="300" height="14" fill="#455a64"/>
  <text x="450" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Whiteboard (matte, tilted on easel, fixed)</text>
  <!-- static aruco markers -->
  <rect x="282" y="72" width="16" height="22" fill="#000"/>
  <rect x="602" y="72" width="16" height="22" fill="#000"/>
  <text x="290" y="112" text-anchor="middle" font-size="11" fill="#222">static</text>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#222">ArUco</text>
  <text x="610" y="112" text-anchor="middle" font-size="11" fill="#222">static</text>
  <text x="610" y="124" text-anchor="middle" font-size="11" fill="#222">ArUco</text>

  <!-- hand -->
  <circle cx="450" cy="215" r="15" fill="#f4b183" stroke="#a1612f" stroke-width="1.5"/>
  <text x="450" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Hand</text>

  <!-- presenter -->
  <circle cx="720" cy="300" r="30" fill="#c5cae9" stroke="#3949ab" stroke-width="2"/>
  <text x="720" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">Presenter</text>
  <text x="720" y="352" text-anchor="middle" font-size="12" fill="#333">stands to the right,</text>
  <text x="720" y="367" text-anchor="middle" font-size="12" fill="#333">outside the beam</text>
  <line x1="692" y1="290" x2="465" y2="218" stroke="#f4b183" stroke-width="8" stroke-linecap="round"/>

  <!-- projector -->
  <rect x="418" y="470" width="64" height="34" rx="4" fill="#607d8b"/>
  <circle cx="450" cy="470" r="6" fill="#ffeb3b" stroke="#f9a825"/>
  <text x="450" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Projector</text>
  <text x="450" y="541" text-anchor="middle" font-size="12" fill="#333">raised or on the table, behind the hand</text>

  <!-- phone -->
  <rect x="130" y="365" width="24" height="42" rx="5" fill="#212121"/>
  <circle cx="142" cy="372" r="3" fill="#4fc3f7"/>
  <text x="142" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">iPhone camera</text>
  <text x="142" y="444" text-anchor="middle" font-size="11" fill="#333">front-left, oblique angle</text>

  <!-- laptop -->
  <rect x="50" y="490" width="100" height="42" rx="4" fill="#90a4ae" stroke="#37474f"/>
  <text x="100" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">MacBook</text>
  <path d="M142 407 C142 450 100 450 100 490" fill="none" stroke="#333" stroke-width="2"/>
  <text x="62" y="462" font-size="12" fill="#333">USB cable</text>

  <text x="880" y="565" text-anchor="end" font-size="11" fill="#777">Not to scale. Nothing moves during the demo (except the planned re-calibration move).</text>
</svg>
