<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Shadow-based touch detection (cross-section)</text>

  <!-- ===== Panel 1: hovering ===== -->
  <g>
    <text x="190" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Hovering: not touching</text>
    <!-- board -->
    <line x1="330" y1="80" x2="330" y2="380" stroke="#455a64" stroke-width="10"/>
    <text x="330" y="400" text-anchor="middle" font-size="12" fill="#333">board surface</text>
    <!-- light -->
    <circle cx="40" cy="100" r="9" fill="#ffeb3b" stroke="#f9a825" stroke-width="2"/>
    <text x="15" y="82" font-size="12" fill="#333">projector (light)</text>
    <!-- ray -->
    <line x1="40" y1="100" x2="330" y2="246" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- finger -->
    <line x1="110" y1="250" x2="248" y2="200" stroke="#f4b183" stroke-width="14" stroke-linecap="round"/>
    <circle cx="250" cy="200" r="5" fill="#d84315"/>
    <text x="250" y="186" text-anchor="middle" font-size="12" fill="#d84315">fingertip</text>
    <!-- fingertip projected perpendicular on board -->
    <line x1="250" y1="200" x2="330" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="330" cy="200" r="3" fill="#d84315"/>
    <!-- shadow tip -->
    <circle cx="330" cy="246" r="5" fill="#212121"/>
    <text x="345" y="250" font-size="12" fill="#212121">shadow tip</text>
    <!-- gap -->
    <line x1="318" y1="200" x2="318" y2="246" stroke="#d81b60" stroke-width="2"/>
    <text x="312" y="228" text-anchor="end" font-size="12" font-weight="bold" fill="#d81b60">gap</text>
    <text x="190" y="430" text-anchor="middle" font-size="13" fill="#333">The camera sees fingertip and shadow tip apart.</text>
    <text x="190" y="447" text-anchor="middle" font-size="13" fill="#333">Gap grows with height above the board.</text>
  </g>

  <!-- ===== Panel 2: touching ===== -->
  <g transform="translate(450 0)">
    <text x="190" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Touching: contact</text>
    <line x1="330" y1="80" x2="330" y2="380" stroke="#455a64" stroke-width="10"/>
    <text x="330" y="400" text-anchor="middle" font-size="12" fill="#333">board surface</text>
    <circle cx="40" cy="100" r="9" fill="#ffeb3b" stroke="#f9a825" stroke-width="2"/>
    <text x="15" y="82" font-size="12" fill="#333">projector (light)</text>
    <line x1="40" y1="100" x2="324" y2="200" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="190" y1="250" x2="322" y2="204" stroke="#f4b183" stroke-width="14" stroke-linecap="round"/>
    <circle cx="324" cy="200" r="5" fill="#d84315"/>
    <circle cx="332" cy="200" r="5" fill="#212121"/>
    <text x="345" y="186" font-size="12" fill="#212121">fingertip and</text>
    <text x="345" y="201" font-size="12" fill="#212121">shadow tip merge</text>
    <text x="190" y="430" text-anchor="middle" font-size="13" fill="#333">Gap is about 0 in board-plane coordinates:</text>
    <text x="190" y="447" text-anchor="middle" font-size="13" fill="#333">touch. Only now trust the mapped (x, y).</text>
  </g>
</svg>
