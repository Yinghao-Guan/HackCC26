<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Physical setup: side view, projector on the table (Option A)</text>

  <!-- floor and table -->
  <line x1="30" y1="520" x2="870" y2="520" stroke="#555" stroke-width="3"/>
  <rect x="40" y="420" width="740" height="12" fill="#a1887f"/>
  <rect x="240" y="432" width="12" height="88" fill="#a1887f"/>
  <rect x="748" y="432" width="12" height="88" fill="#a1887f"/>
  <text x="400" y="456" text-anchor="middle" font-size="12" fill="#6d4c41">table</text>

  <!-- beam -->
  <polygon points="150,395 568,110 612,415" fill="#ffd54f" fill-opacity="0.22" stroke="#f9a825" stroke-dasharray="6 4"/>

  <!-- projector, upright on the table, lens aimed up -->
  <polygon points="70,420 70,386 150,382 150,420" fill="#607d8b"/>
  <circle cx="150" cy="395" r="5" fill="#ffeb3b" stroke="#f9a825"/>
  <text x="105" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Projector</text>
  <text x="105" y="476" text-anchor="middle" font-size="12" fill="#333">upright, on the table.</text>
  <text x="105" y="491" text-anchor="middle" font-size="12" fill="#333">Keystone correction OFF.</text>
  <text x="105" y="506" text-anchor="middle" font-size="12" fill="#333">Use its upward throw offset.</text>

  <!-- board: vertical or leaning slightly forward -->
  <line x1="612" y1="420" x2="568" y2="110" stroke="#455a64" stroke-width="12" stroke-linecap="round"/>
  <line x1="580" y1="170" x2="700" y2="420" stroke="#8d6e63" stroke-width="8"/>
  <text x="640" y="95" font-size="14" font-weight="bold" fill="#222">Whiteboard</text>
  <text x="640" y="112" font-size="12" fill="#333">vertical or leaning slightly</text>
  <text x="640" y="127" font-size="12" fill="#333">forward, NOT far back: a low</text>
  <text x="640" y="142" font-size="12" fill="#333">projector hits a back-tilted</text>
  <text x="640" y="157" font-size="12" fill="#333">board at a grazing angle.</text>
  <text x="715" y="380" font-size="12" fill="#333">fixed support</text>
  <text x="715" y="395" font-size="12" fill="#333">(easel, clamps, weights)</text>

  <!-- arm and fingertip (hovering) -->
  <line x1="380" y1="352" x2="556" y2="306" stroke="#f4b183" stroke-width="16" stroke-linecap="round"/>
  <circle cx="560" cy="305" r="5" fill="#d84315"/>
  <text x="440" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Hand</text>
  <text x="560" y="288" text-anchor="middle" font-size="12" fill="#d84315">fingertip</text>

  <!-- shadow tip (ray from lens through fingertip) -->
  <line x1="560" y1="305" x2="594" y2="297" stroke="#f9a825" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="594" cy="297" r="5" fill="#212121"/>
  <line x1="470" y1="268" x2="590" y2="295" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="330" y="252" font-size="12" fill="#212121">shadow tip (black dot): the gap is long</text>
  <text x="330" y="267" font-size="12" fill="#212121">at a grazing angle. Check it stays</text>
  <text x="330" y="282" font-size="12" fill="#212121">visible and stable.</text>

  <!-- camera -->
  <rect x="300" y="382" width="22" height="38" rx="4" fill="#212121"/>
  <circle cx="311" cy="388" r="3" fill="#4fc3f7"/>
  <text x="311" y="408" text-anchor="middle" font-size="1" fill="#ffffff"> </text>
  <path d="M322 392 C400 360 480 322 552 308" fill="none" stroke="#0288d1" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="290" y="372" text-anchor="end" font-size="12" font-weight="bold" fill="#222">iPhone</text>
  <text x="290" y="388" text-anchor="end" font-size="11" fill="#01579b">(front-left,</text>
  <text x="290" y="402" text-anchor="end" font-size="11" fill="#01579b">out of plane)</text>

  <!-- warnings -->
  <text x="230" y="200" text-anchor="middle" font-size="12" fill="#333">Low beam: the arm blocks more of</text>
  <text x="230" y="215" text-anchor="middle" font-size="12" fill="#333">the projection, especially when</text>
  <text x="230" y="230" text-anchor="middle" font-size="12" fill="#333">writing high on the board.</text>

  <text x="880" y="565" text-anchor="end" font-size="11" fill="#777">Not to scale. Alternative: raise the projector (see side view, Option B).</text>
</svg>
